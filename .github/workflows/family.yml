# One base family (its variants and example) from lint to published tags.
# ci.yml calls this once per family, so a failure in one never blocks another.
#
# When publishing, bases are pushed untagged by digest, and the test job pulls
# and tests those exact digests. Promote then signs and attests them, and moves
# the floating tags only once verification passes. A failure anywhere leaves the
# tags on the previous good build.
name: Family

on:
  workflow_call:
    inputs:
      family:
        description: docker-bake.hcl group, e.g. static
        type: string
        required: true
      package:
        description: GHCR package name under ghcr.io/fivexl
        type: string
        required: true
      version-tag:
        description: Floating version tag, e.g. debian13
        type: string
        required: true
      variants:
        description: JSON list of variants; tag suffix is empty for production
        type: string
        default: '["production", "rds"]'
      publish:
        type: boolean
        required: true
      created:
        description: Build time (RFC 3339, UTC) shared by every family of the run
        type: string
        required: true
      no-cache:
        type: boolean
        default: false

permissions: {}

env:
  REGISTRY: ghcr.io/fivexl
  TRIVY_VERSION: v0.76.1

jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List Dockerfiles
        id: files
        run: |
          echo "files=$(docker buildx bake --print "${{ inputs.family }}" 2>/dev/null \
            | jq -r '[.target[] | "\(.context)/\(.dockerfile)"] | unique | map(sub("^\\./"; "")) | join(" ")')" >> "$GITHUB_OUTPUT"
      - name: Hadolint
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: |
          for f in $FILES; do
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < "$f"
            echo "::endgroup::"
          done

  # The job body is shared through a YAML anchor; the two jobs differ only in
  # permissions, so pull requests never hold a token that can write packages.
  test:
    if: ${{ !inputs.publish }}
    needs: lint
    strategy: &platforms
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      security-events: write
    steps: &build-test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          PUBLISH: ${{ inputs.publish }}
          REVISION: ${{ github.sha }}
          CREATED: ${{ inputs.created }}
          NO_CACHE: ${{ inputs.no-cache && '--no-cache' || '' }}
        run: |
          # shellcheck disable=SC2086 # NO_CACHE is a flag or empty
          docker buildx bake $NO_CACHE --metadata-file "$RUNNER_TEMP/bake.json" "${{ inputs.family }}"

      # From here on, test exactly what will be published: the pushed digests
      # when publishing, the locally loaded images otherwise.
      - name: Resolve images under test
        env:
          FAMILY: ${{ inputs.family }}
          PACKAGE: ${{ inputs.package }}
          VARIANTS: ${{ inputs.variants }}
          PUBLISH: ${{ inputs.publish }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          : > "$RUNNER_TEMP/images"
          for variant in $(jq -r '.[]' <<< "$VARIANTS"); do
            image="local/$FAMILY-$variant:test"
            if [[ $PUBLISH == true ]]; then
              digest=$(jq -er --arg t "$FAMILY-$variant" '.[$t]["containerimage.digest"]' "$RUNNER_TEMP/bake.json")
              image="$REGISTRY/$PACKAGE@$digest"
              docker pull --quiet "$image"
              echo "$digest" > "$RUNNER_TEMP/digests/$variant"
            fi
            echo "base $variant $image" >> "$RUNNER_TEMP/images"
          done
          echo "example example local/$FAMILY-example:test" >> "$RUNNER_TEMP/images"
          cat "$RUNNER_TEMP/images"

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Scan
        env:
          FAMILY: ${{ inputs.family }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/sarif"
          rc=0
          while read -r _ variant image; do
            category="$FAMILY-$variant-$ARCH"
            echo "::group::trivy $category"
            trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --format table "$image" || rc=1
            trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed \
              --format sarif --output "$RUNNER_TEMP/sarif/$category.raw" "$image"
            # One category per image, so results of different images don't overwrite each other.
            jq --arg c "$category/" '.runs[].automationDetails = {id: $c}' \
              "$RUNNER_TEMP/sarif/$category.raw" > "$RUNNER_TEMP/sarif/$category.sarif"
            rm "$RUNNER_TEMP/sarif/$category.raw"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/images"
          exit $rc

      - name: Upload scan results
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/sarif

      - name: Smoke test
        env:
          FAMILY: ${{ inputs.family }}
        run: |
          while read -r kind variant image; do
            echo "::group::$kind $variant"
            if [[ $kind == base ]]; then
              scripts/smoke-test.sh base "$FAMILY" "$variant" "$image"
            else
              scripts/smoke-test.sh example "$FAMILY" "$image"
            fi
            echo "::endgroup::"
          done < "$RUNNER_TEMP/images"

      - name: Upload candidate digests
        if: ${{ inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ inputs.family }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  test-publish:
    if: ${{ inputs.publish }}
    needs: lint
    strategy: *platforms
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write
    steps: *build-test-steps

  promote:
    if: ${{ inputs.publish }}
    needs: test-publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    concurrency:
      group: promote-${{ inputs.family }}
      cancel-in-progress: false
    env:
      REPO: ghcr.io/fivexl/${{ inputs.package }}
      CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/family.yml@refs/heads/main
      CERT_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ inputs.family }}-*
          path: ${{ runner.temp }}/digests

      # A slower run that started earlier must not move tags back to older content.
      - name: Skip if a newer build is already published
        id: stale
        env:
          CREATED: ${{ inputs.created }}
        run: |
          current=$(docker buildx imagetools inspect "$REPO:latest" --format '{{json .Image}}' 2>/dev/null \
            | jq -r 'if has("config") then . else .["linux/amd64"] end | .config.Labels["org.opencontainers.image.created"] // ""' \
            || true)
          echo "published: ${current:-none}, this run: $CREATED"
          if [[ -n $current && $current > $CREATED ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$REPO:latest was built at $current, after this run; leaving tags alone"
          fi

      - name: Merge, sign, attest, verify and tag
        if: ${{ steps.stale.outputs.skip != 'true' }}
        env:
          VARIANTS: ${{ inputs.variants }}
          VERSION_TAG: ${{ inputs.version-tag }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          for variant in $(jq -r '.[]' <<< "$VARIANTS"); do
            suffix=$([[ $variant == production ]] && echo "" || echo "-$variant")
            echo "::group::$variant"

            # Build the multi-platform index from the tested per-platform digests
            # and push it by digest only, so nothing follows it yet.
            sources=()
            for arch in amd64 arm64; do
              sources+=("$REPO@$(cat "$DIGESTS/digests-${{ inputs.family }}-$arch/$variant")")
            done
            docker buildx imagetools create --dry-run "${sources[@]}" > index.json
            index="sha256:$(sha256sum index.json | cut -d' ' -f1)"
            oras manifest push --media-type application/vnd.oci.image.index.v1+json \
              "$REPO@$index" index.json

            cosign sign --yes --recursive "$REPO@$index"
            for arch in amd64 arm64; do
              child=$(jq -er --arg a "$arch" \
                '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' index.json)
              docker buildx imagetools inspect "$REPO@$index" \
                --format "{{json (index .SBOM \"linux/$arch\").SPDX}}" > "sbom-$arch.spdx.json"
              cosign attest --yes --type spdxjson --predicate "sbom-$arch.spdx.json" "$REPO@$child"
              cosign verify-attestation --type spdxjson \
                --certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER" \
                "$REPO@$child" > /dev/null
            done
            cosign verify \
              --certificate-identity "$CERT_IDENTITY" --certificate-oidc-issuer "$CERT_ISSUER" \
              "$REPO@$index" > /dev/null

            oras tag "$REPO@$index" "latest$suffix" "$VERSION_TAG$suffix"
            echo "$REPO:latest$suffix and :$VERSION_TAG$suffix -> $index" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
