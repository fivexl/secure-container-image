name: Build and push Docker images

on:
  push:
    branches: ["main"]
  pull_request:
  # Daily no-cache rebuild: floating inputs pick up upstream security fixes.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

# One run per branch at a time, in the order runs were created; a newer run
# replaces one still pending. So an older main build never publishes after a
# newer one. Pull request runs cancel their outdated predecessors.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      created: ${{ steps.created.outputs.created }}
    steps:
      - id: created
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  static:
    needs: setup
    uses: ./.github/workflows/family.yml
    permissions: &family-permissions
      contents: read
      packages: write
      security-events: write
      id-token: write
    with:
      family: static
      package: secure-container-image-base
      version-tag: debian13
      no-cache: ${{ needs.setup.outputs.no-cache == 'true' }}
      created: ${{ needs.setup.outputs.created }}

  python3:
    needs: setup
    uses: ./.github/workflows/family.yml
    permissions: *family-permissions
    with:
      family: python3
      package: secure-container-image-base-python3
      version-tag: python3.13-debian13
      no-cache: ${{ needs.setup.outputs.no-cache == 'true' }}
      created: ${{ needs.setup.outputs.created }}

  nodejs:
    needs: setup
    uses: ./.github/workflows/family.yml
    permissions: *family-permissions
    with:
      family: nodejs
      package: secure-container-image-base-nodejs
      version-tag: node26-debian13
      no-cache: ${{ needs.setup.outputs.no-cache == 'true' }}
      created: ${{ needs.setup.outputs.created }}
