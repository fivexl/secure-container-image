# Opens a quarterly issue to review the public container hardening guide,
# whose snippets quote this repo's tags, uid and variants.
name: Guide review

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *"
  workflow_dispatch:

permissions: {}

# Serializes the check-then-create below so overlapping runs open one issue.
concurrency:
  group: guide-review
  cancel-in-progress: false

jobs:
  open-issue:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open review issue
        run: |
          set -euo pipefail
          # The quarter in the title keeps an unfinished review from hiding the next one.
          title="Review the container hardening guide ($(date -u +%Y)-Q$(( ($(date -u +%-m) + 2) / 3 )))"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json title \
            --jq "map(select(.title == \"$title\")) | length")
          if [[ $open -gt 0 ]]; then
            echo "An open issue titled \"$title\" already exists; skipping"
            exit 0
          fi
          gh issue create --title "$title" --body-file - <<'EOF'
          Quarterly review of the [container hardening guide](https://fivexl.io/blog/container-hardening-guide/), source in [fivexl/website](https://github.com/fivexl/website/blob/main/content/blog/container-hardening-guide/index.md).

          - [ ] Snippet versions are current: base image tags, action SHAs, tool versions.
          - [ ] Base image changes since the last review are reflected: tags, uid, variants.
          - [ ] New AWS and Kubernetes controls worth adding are listed or added.
          - [ ] The guide has a Changelog entry for this review, even if it says "no changes".
          EOF
